name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

env:
  GODOT_VERSION: "4.3"

jobs:
  test:
    name: Validate & Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Verify Godot install
        run: godot --version

      - name: Import project (headless)
        run: godot --headless --editor --quit-after 60 || true

      - name: Run test suite
        run: godot --headless --script tests/run_tests.gd

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Install Android build template
        run: godot --headless --install-android-build-template

      # Debug keystore lets CI produce an installable, unsigned-for-release
      # test APK without any real signing secrets committed to the repo.
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure debug signing
        run: |
          mkdir -p ~/.config/godot
          cat >> export_presets.cfg <<'EOF'

          [preset.0.options.override]
          keystore/debug="debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF

      - name: Import project
        run: godot --headless --editor --quit-after 60 || true

      - name: Export Android APK (debug)
        run: |
          mkdir -p builds/android
          godot --headless --export-debug "Android" builds/android/ArrowLegends3D.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArrowLegends3D-debug-apk
          path: builds/android/ArrowLegends3D.apk
          if-no-files-found: error

# NOTE: no real signing secrets are stored in this repo. For a Google
# Play release build (AAB), add these repository secrets and a signing
# step before the export: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
