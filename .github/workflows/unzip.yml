name: Extract Arrow Legends

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          echo "Files in repository:"
          ls -lah

          if [ ! -f "arrow-legends-3d.zip" ]; then
            echo "ERROR: arrow-legends-3d.zip NOT FOUND"
            exit 1
          fi

          echo "ZIP FOUND:"
          ls -lh "arrow-legends-3d.zip"

      - name: Extract
        run: |
          mkdir -p game

          unzip -o "arrow-legends-3d.zip" -d game

          echo "Extraction completed."

      - name: Find Godot project
        run: |
          echo "Searching for project.godot..."

          find game -name "project.godot" -print

      - name: Move project
        run: |
          PROJECT=$(find game -name "project.godot" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: project.godot was not found inside ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Godot project found at:"
          echo "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. .

          rm -rf game
          rm -f "arrow-legends-3d.zip"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit -m "Extract Arrow Legends 3D project" || echo "Nothing to commit"

          git push
