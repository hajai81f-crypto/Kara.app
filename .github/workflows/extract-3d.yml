name: Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3-stable"

jobs:
  test:
    name: Validate & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.3
        uses: lihop/setup-godot@v3
        with:
          version: ${{ env.GODOT_VERSION }}
          export-templates: true
          cache: true

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: |
          godot --headless --editor --quit

      - name: Run tests
        if: ${{ hashFiles('tests/run_tests.gd') != '' }}
        run: |
          godot --headless --script tests/run_tests.gd

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Godot 4.3
        uses: lihop/setup-godot@v3
        with:
          version: ${{ env.GODOT_VERSION }}
          export-templates: true
          cache: true

      - name: Verify Godot
        run: godot --version

      - name: Install Android build template
        run: |
          godot --headless --install-android-build-template

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Android debug signing
        run: |
          cat >> export_presets.cfg <<'EOF'

          [preset.0.options.override]
          keystore/debug="debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF

      - name: Import project
        run: |
          godot --headless --editor --quit

      - name: Export Android APK
        run: |
          mkdir -p builds/android
          godot --headless \
            --export-debug "Android" \
            builds/android/ArrowLegends3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArrowLegends3D-debug-apk
          path: builds/android/ArrowLegends3D.apk
          if-no-files-found: error
