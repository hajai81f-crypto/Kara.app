name: Extract 3D ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP files..."

          ZIP_FILE=$(find . -type f \( -iname "3D.zip" -o -iname "*.zip" \) -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP contents:"
          find extracted -maxdepth 3 -print

          # إذا كان داخل ZIP مجلد واحد، نأخذ محتوياته مباشرة
          ITEMS=$(find extracted -mindepth 1 -maxdepth 1 -print)

          COUNT=$(echo "$ITEMS" | wc -l)

          if [ "$COUNT" -eq 1 ] && [ -d "$ITEMS" ]; then
            echo "Single folder detected. Moving its contents to repository root."
            shopt -s dotglob
            cp -R "$ITEMS"/* .
          else
            echo "Moving ZIP contents to repository root."
            shopt -s dotglob
            cp -R extracted/* .
          fi

          rm -rf extracted

          # حذف ملف ZIP بعد فكّه
          rm -f "$ZIP_FILE"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Extract 3D.zip to repository root"
            git push
          fi
