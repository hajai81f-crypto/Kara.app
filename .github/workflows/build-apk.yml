name: Auto Fix And Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0

      - name: Install Android Export Templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot
          cp /tmp/godot/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Auto Fix Project Code
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("arrow-legends-3d")

          # StageGenerator.gd
          p = root / "scripts/stages/StageGenerator.gd"

          if p.exists():
              s = p.read_text()

              # Remove invalid constant
              s = re.sub(
                  r'^\s*const\s+RNG\s*:=\s*RandomNumberGenerator\s*$',
                  '',
                  s,
                  flags=re.MULTILINE
              )

              # Make speed explicitly typed
              s = re.sub(
                  r'var\s+speed\s*:=',
                  'var speed: float =',
                  s
              )

              # Make env_key explicitly String typed
              s = re.sub(
                  r'var\s+env_key\s*:=\s*Constants\.ENVIRONMENT_NAMES\.get\(([^)]*)\)',
                  r'var env_key: String = str(Constants.ENVIRONMENT_NAMES.get(\1))',
                  s
              )

              p.write_text(s)

          print("Automatic code repair completed.")
          PY

      - name: Validate Godot Project
        run: |
          godot --headless \
            --editor \
            --path arrow-legends-3d \
            --quit

      - name: Build Android APK
        run: |
          mkdir -p arrow-legends-3d/builds

          godot --headless \
            --path arrow-legends-3d \
            --export-debug "Android" \
            builds/ArrowLegends3D.apk

      - name: Check APK
        run: |
          test -f arrow-legends-3d/builds/ArrowLegends3D.apk
          ls -lh arrow-legends-3d/builds/ArrowLegends3D.apk

      - name: Give Me APK
        uses: actions/upload-artifact@v4
        with:
          name: ArrowLegends3D-APK
          path: arrow-legends-3d/builds/ArrowLegends3D.apk
